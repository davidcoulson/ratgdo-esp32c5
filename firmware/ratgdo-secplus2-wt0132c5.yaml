# ratgdo 2.5i with the ESP-12F (ESP8266) replaced by a WT0132C5-S5 (ESP32-C5),
# running esphome-ratgdo for Security+ 2.0 openers.
#
# Based on ratgdo/esphome-ratgdo static/v25iboard.yaml: same entities, with the
# esp8266 block swapped for an ESP-IDF esp32 block and the pins remapped to the
# C5 module's pads. See docs/pin-mapping.md for where each GPIO lands.
#
# For a WT0132C6-S5 (ESP32-C6), swap the pins and the esp32 block for the
# values in the right-hand comments.

substitutions:
  name: ratgdo-c5
  friendly_name: ratgdo C5
  id_prefix: ratgdov25i
  # WT0132C5                               # WT0132C6
  uart_tx_pin: GPIO25                      # GPIO3
  uart_rx_pin: GPIO26                      # GPIO10
  input_obst_pin: GPIO6                    # GPIO6
  status_door_pin: GPIO2                   # GPIO2
  status_obstruction_pin: GPIO24           # GPIO7
  dry_contact_open_pin: GPIO4              # GPIO4
  dry_contact_close_pin: GPIO5             # GPIO5
  dry_contact_light_pin: GPIO28            # GPIO9

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true

esp32:
  board: esp32-c5-devkitc-1                # esp32-c6-devkitc-1
  variant: esp32c5                         # esp32c6
  framework:
    type: esp-idf
    # The version this was tested with. ESPHome warns that it isn't the
    # recommended one; that warning is expected.
    version: 6.1.0

packages:
  remote_package:
    url: https://github.com/ratgdo/esphome-ratgdo
    ref: main
    files: [base.yaml]
    refresh: 1d

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ratgdo"

captive_portal:

# Needed for the sync-failed notification. base.yaml defines it already;
# base_secplusv1.yaml does not.
api:

web_server:
  local: true

improv_serial:

logger:

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s

time:
  - platform: homeassistant
    id: homeassistant_time
